<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis — AI Assistant</title>
<meta name="description" content="Jarvis, a fast AI assistant powered by Groq." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="scene">
    <div class="grid-overlay" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="core" id="core">
          <span class="core-ring ring-1"></span>
          <span class="core-ring ring-2"></span>
          <span class="core-dot"></span>
        </div>
        <div class="brand-text">
          <h1>JARVIS</h1>
          <p class="tagline">Just A Rather Very Intelligent System</p>
        </div>
      </div>

      <div class="status-cluster">
        <div class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">Online</span>
        </div>
        <span class="engine-label">groq // llama-3.3-70b</span>
        <button class="reset-btn" id="resetBtn" title="Start a new conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>
    </header>

    <main class="chat-shell">
      <div class="chat-log" id="chatLog">
        <div class="msg assistant" data-role="assistant">
          <div class="avatar assistant-avatar" aria-hidden="true">
            <span class="avatar-ring"></span>
          </div>
          <div class="bubble">
            <p>Hey! I'm Jarvis. How may I help you?</p>
            <span class="timestamp">system boot</span>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="waveform" id="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <form id="chatForm" class="input-row" autocomplete="off">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask Jarvis anything..."
            aria-label="Message"
            maxlength="4000"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </button>
        </form>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
